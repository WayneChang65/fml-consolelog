# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
    push:
        branches: ['master', 'develop']
    pull_request:
        branches: ['master', 'develop']

jobs:
    build:
        runs-on: self-hosted

        strategy:
            matrix:
                os: [ubuntu-latest]
                node-version: [22.x]
                arch: [arm64]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.arch }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint
            - name: Run test
              run: npm run test
            - name: Build project
              run: npm run build
            - name: Verify ESM build
              run: |
                  node -e '
                  (async () => {
                      const url = "file://" + process.cwd() + "/dist/index.js";
                      const pkg = await import(url);
                      if (typeof pkg.log !== "function") {
                          console.error("ESM check failed: no log() export");
                          process.exit(1);
                      }
                      console.log("ESM build OK");
                  })();
                  '
            - name: Verify CJS build
              run: |
                  node -e '
                  const { createRequire } = require("node:module");
                  const req = createRequire(process.cwd() + "/");
                  const mod = req("./dist/cjs/index.cjs");
                  if (typeof mod.log !== "function") {
                      console.error("CJS check failed: no log() export");
                      process.exit(1);
                  }
                  console.log("CJS build OK");
                  '
            - name: Run start ts
              run: npm run start
            - name: Run start-cjs
              run: npm run start-cjs
